name: autologic_drive
description: "AutoLogic Drive — GPS tracker pre vozový park Starlogic AutoLogic."
publish_to: 'none'
version: 0.13.2+23

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  tracelet: ^1.9.1
  http: ^1.2.0
  flutter_blue_classic: ^0.0.5
  permission_handler: ^11.3.1
  local_auth: ^2.3.0
  flutter_local_notifications: ^17.2.4
  sqflite: ^2.3.3
  path: ^1.9.0
  uuid: ^4.5.1
  share_plus: ^10.0.0
  path_provider: ^2.1.4
  package_info_plus: ^8.0.0
  shared_preferences: ^2.5.5
  quick_actions: ^1.1.0
  shared_preferences_android: ^2.4.23
  wakelock_partial_android: ^1.0.1
  mobile_scanner: ^7.2.0
  flutter_secure_storage: ^10.0.0
  app_links: ^7.0.0
  app_settings: ^7.0.0
  geocoding: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon/autologic_icon.png
    - assets/icon/autologic_kj_logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/autologic_icon.png"
  adaptive_icon_background: "#E8F0FE"
  adaptive_icon_foreground: "assets/icon/autologic_icon.png"
  min_sdk_android: 23
